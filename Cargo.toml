[package]
name = "reccedns"
authors = ["Alex Ogden"]
version = "0.18.1"
repository = "https://github.com/alexogden/reccedns"
license = "GPL-3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive", "env"] }
colored = "3.1.1"
ctrlc = "3.5.2"
dashmap = "6.1.0"
indicatif = "0.18.4"
num_cpus = "1.17.0"
num_enum = "0.7.5"
rand = "0.10.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
hyper = { version = "1.8.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client", "client-legacy", "http1"] }
http-body-util = "0.1.3"
bytes = "1.11.1"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort" 
