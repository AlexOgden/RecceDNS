[package]
name = "reccedns"
authors = ["Alex Ogden"]
version = "0.22.0"
repository = "https://github.com/alexogden/reccedns"
license = "GPL-3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
colored = "3.1.1"
ctrlc = "3.5.2"
dashmap = "6.1.0"
indicatif = "0.18.6"
num_enum = "0.7.6"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum_macros = "0.28.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client", "client-legacy", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort" 
