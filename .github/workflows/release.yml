name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes generation

      - name: Get Version
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "## What's New"
              echo ""
              echo "First release!"
              echo ""
              git log --pretty=format:"* %s (%an)" "${GITHUB_REF_NAME}"
            else
              echo "## What's Changed"
              echo ""
              echo "Changes since ${PREVIOUS_TAG}:"
              echo ""
              git log --pretty=format:"* %s (%an)" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}"
            fi
            echo ""
          } > release_notes.md

      # Created as draft; published only after all artifacts uploaded.
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          prerelease: false

  build_and_upload_standard:
    needs: create_release
    name: Build and Upload - ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_name: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_name: win-x86_64
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_name: mac-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_name: mac-aarch64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary for upload
        shell: bash
        env:
          VERSION: ${{ needs.create_release.outputs.version }}
        run: |
          ASSET_NAME="reccedns-${VERSION}-${{ matrix.platform_name }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/reccedns${{ matrix.ext }}" "${ASSET_NAME}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./${{ env.ASSET_NAME }}

  build_and_upload_arm:
    needs: create_release
    name: Build and Upload ARM - ${{ matrix.platform_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            platform_name: linux-armv7
            docker_image: messense/rust-musl-cross:armv7-musleabihf
          - target: aarch64-unknown-linux-musl
            platform_name: linux-aarch64
            docker_image: messense/rust-musl-cross:aarch64-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Project uses rustls (ring); no OpenSSL needed.
      - name: Build in Docker
        env:
          VERSION: ${{ needs.create_release.outputs.version }}
        run: |
          ASSET_NAME="reccedns-${VERSION}-${{ matrix.platform_name }}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

          docker run --rm \
            -v "$(pwd)":/home/rust/src \
            -w /home/rust/src \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            ${{ matrix.docker_image }} \
            cargo build --release --locked --target ${{ matrix.target }}

          sudo chown "$(id -u):$(id -g)" "target/${{ matrix.target }}/release/reccedns"
          cp "target/${{ matrix.target }}/release/reccedns" "${ASSET_NAME}"
          ls -la "${ASSET_NAME}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./${{ env.ASSET_NAME }}

  build_and_publish_docker:
    needs: create_release
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          VERSION: ${{ needs.create_release.outputs.version }}
        run: |
          VERSION_NO_V=${VERSION#v}
          MAJOR=$(echo "${VERSION_NO_V}" | cut -d. -f1)
          MINOR=$(echo "${VERSION_NO_V}" | cut -d. -f2)
          {
            echo "version_no_v=${VERSION_NO_V}"
            echo "major=${MAJOR}"
            echo "major_minor=${MAJOR}.${MINOR}"
            # GHCR requires lowercase image names
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version_no_v }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.major_minor }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.major }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=RecceDNS
            org.opencontainers.image.description=DNS Enumeration and Information Gathering Tool
            org.opencontainers.image.version=${{ steps.version.outputs.version_no_v }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release notes with Docker information
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create_release.outputs.version }}
          append_body: true
          body: |
            ## Docker Images

            Docker images are available on GitHub Container Registry:
            ```
            docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version_no_v }}
            docker pull ${{ steps.version.outputs.image }}:latest
            ```

  publish_release:
    needs: [create_release, build_and_upload_standard, build_and_upload_arm, build_and_publish_docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

